# =====================================================================
# MATRIZ DE MOVIMENTO "marcha_avanco" — cópia dos parâmetros da
# teste_equilibrio (roll ±16°, trim de quadril -7°, timing 8 etapas)
# ADICIONANDO avanço: X = ±10mm. Gerada pela IK do controle_pe (Newton
# sobre a FK do URDF, pé paralelo ao tronco, rolls via SINAIS_ROLL, trim
# via SINAIS_TRIM_QUADRIL).
#
# ALTURA DO QUADRIL: dz_base=+5mm uniforme nos dois pés em TODAS as
# colunas agacha o robô de 195mm para 190mm de altura base_link->pé
# (confirmado por FK — essa é a distância torso-ao-pé com a perna
# dobrada na marcha, NÃO o alcance quadril-tornozelo de ~152mm usado
# antes para checar limite físico). Os 15mm de levantamento do pé de
# balanço continuam um incremento RELATIVO sobre esse novo piso
# (5+15=20mm nas colunas "no ar").
#
# O pé que "voa" (colunas 3 e 7) já migra para a posição X oposta DURANTE
# o "no ar" — a troca de lado acontece toda enquanto o pé está elevado;
# a coluna de "pousa" só abaixa o pé, mantendo o X já alcançado.
#
# QUEBRA DE PARALELOGRAMO PROPOSITAL no tornozelo de apoio (3°): nas
# colunas 2-4 (PD é apoio) o roll do pd_roll_tornozelo_1 fica 3° a MENOS
# em magnitude que o pd_roll_quadril_9 (13° em vez de 16°); espelho nas
# colunas 6-8 (PE é apoio): pe_roll_tornozelo_2 fica 13° em vez de 16°.
# Sem carga o pé fica levemente na borda interna; quando o peso chega e o
# servo cede, o cedimento assenta a sola chapada em vez de rolá-la pra
# fora — pré-compensação do sag. Perna oposta e colunas neutras (1,5)
# não são tocadas.
#
# As 8 etapas (roll°, x_mm, pd_z_mm, pe_z_mm — já incluindo dz_base=+5):
#   1) roll=  0, x=+10, pd_z=5,  pe_z=5    neutro: PD à frente
#   2) roll=+16, x=+10, pd_z=5,  pe_z=5    peso à direita (PE ainda no chão)
#   3) roll=+16, x=-10, pd_z=5,  pe_z=20   PE no ar (avança de +10 p/ -10)
#   4) roll=+16, x=-10, pd_z=5,  pe_z=5    PE pousa (roll ainda positivo)
#   5) roll=  0, x=-10, pd_z=5,  pe_z=5    neutro: PE à frente
#   6) roll=-16, x=-10, pd_z=5,  pe_z=5    peso à esquerda (PD ainda no chão)
#   7) roll=-16, x=+10, pd_z=20, pe_z=5    PD no ar (avança de -10 p/ +10)
#   8) roll=-16, x=+10, pd_z=5,  pe_z=5    PD pousa (roll ainda negativo)
# =====================================================================

passo: 0.3
pausa: 0.1
# Duracao e pausa POR COLUNA: neutro (1,5) 0.30s/0.10s, peso (2,6)
# 0.25s/0.15s (aumentado de 0.05s -- testar se cobre o atraso do servo
# sob carga na transferencia de peso, sintoma "tronco cai quando o pe
# deveria subir"), voo (3,7) 0.30s/0s, pouso (4,8) 0.25s/0.10s.
passos: [0.30, 0.25, 0.30, 0.25, 0.30, 0.25, 0.30, 0.25]
pausas: [0.10, 0.15, 0.00, 0.10, 0.10, 0.15, 0.00, 0.10]

nomes_juntas:
  - pd_roll_tornozelo_1
  - pe_roll_tornozelo_2
  - pd_picht_tornozelo_3
  - pe_picht_tornozelo_4
  - pd_picht_joelho_5
  - pe_picht_joelho_6
  - pd_picht_quadril_7
  - pe_pich_quadril_8
  - pd_roll_quadril_9
  - pe_roll_quadril_10

matriz_movimento:
  - [ -0.000000, -0.226893, -0.226893, -0.226893, -0.000000,  0.279253,  0.279253,  0.279253 ]  # pd_roll_tornozelo_1
  - [ -0.000000, -0.279253, -0.279253, -0.279253, -0.000000,  0.226893,  0.226893,  0.226893 ]  # pe_roll_tornozelo_2
  - [ -0.757688, -0.757688, -0.868106, -0.868106, -0.868106, -0.868106, -0.937981, -0.757688 ]  # pd_picht_tornozelo_3
  - [  0.668840,  0.668840,  0.644847,  0.491821,  0.491821,  0.491821,  0.668840,  0.668840 ]  # pe_picht_tornozelo_4
  - [  1.421719,  1.421719,  1.345695,  1.345695,  1.345695,  1.345695,  1.766770,  1.421719 ]  # pd_picht_joelho_5
  - [ -1.428087, -1.428087, -1.724688, -1.373301, -1.373301, -1.373301, -1.428087, -1.428087 ]  # pe_picht_joelho_6
  - [ -0.786204, -0.786204, -0.599762, -0.599762, -0.599762, -0.599762, -0.950962, -0.786204 ]  # pd_picht_quadril_7
  - [  0.881420,  0.881420,  1.202014,  1.003652,  1.003652,  1.003652,  0.881420,  0.881420 ]  # pe_pich_quadril_8
  - [  0.000000, -0.279253, -0.279253, -0.279253,  0.000000,  0.279253,  0.279253,  0.279253 ]  # pd_roll_quadril_9
