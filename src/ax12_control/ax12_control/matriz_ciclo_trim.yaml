# Matriz de marcha = matriz_ciclo.yaml + TRIM DE PITCH DO QUADRIL de -7 graus.
# Angulos em RADIANOS, convencao do URDF.
#
# O trim e o mesmo do slider "Trim quadril (pitch)" do controle_pe (o
# hip_pitch_offset do OP3): um offset somado SO aos pitchs de quadril, em
# todas as colunas, para compensar o tronco que cede sob o proprio peso e
# deixa-lo alinhado. Tornozelo e joelho ficam intactos de proposito — e essa
# diferenca que inclina o tronco em relacao as pernas.
#
#   trim = -7.0 graus = -0.122173 rad
#   pd_picht_quadril_7 += (+1) * trim  ->  -0.1222 rad
#   pe_pich_quadril_8  += (-1) * trim  ->  +0.1222 rad
#   (sinais = SINAIS_TRIM_QUADRIL do controle_pe: PD/PE espelhados no URDF)
#
# E o que o controle_pe faz com a postura base (coluna 1) quando o slider de
# trim esta em -7.0 graus e o resto zerado — aqui aplicado a TODAS as colunas.
# Demais linhas: identicas a matriz_ciclo. Colunas (etapas do ciclo):
#   0: 1 PD frente, roll 0
#   1: 2 PD frente, peso dir
#   2: 3 PE no ar
#   3: 4 PE frente, peso dir
#   4: 5 PE frente, roll 0
#   5: 6 PE frente, peso esq
#   6: 7 PD no ar
#   7: 8 PD frente, peso esq
#
# Rodar:
#   ros2 launch ax12_control marcha_manual.launch.py matriz:=matriz_ciclo_trim
#   ros2 run ax12_control marcha_continua --ros-args -p matriz:=matriz_ciclo_trim

passo: 1.0      # segundos por transicao
pausa: 0.5      # repouso extra apos cada transicao

nomes_juntas:
  - pd_roll_tornozelo_1    # ID 1
  - pe_roll_tornozelo_2    # ID 2
  - pd_picht_tornozelo_3    # ID 3
  - pe_picht_tornozelo_4    # ID 4
  - pd_picht_joelho_5    # ID 5
  - pe_picht_joelho_6    # ID 6
  - pd_picht_quadril_7    # ID 7
  - pe_pich_quadril_8    # ID 8
  - pd_roll_quadril_9    # ID 9
  - pe_roll_quadril_10    # ID 10

matriz_movimento:
  - [ 0.0000, -0.1745, -0.1745, -0.1745, -0.0000,  0.1745,  0.1745,  0.1745]  # pd_roll_tornozelo_1
  - [ 0.0000, -0.1745, -0.1745, -0.1745,  0.0000,  0.1745,  0.1745,  0.1745]  # pe_roll_tornozelo_2
  - [-0.3921, -0.3919, -0.5571, -0.7010, -0.7015, -0.6335, -0.7406, -0.3267]  # pd_picht_tornozelo_3
  - [ 0.7088,  0.6398,  0.7500,  0.3365,  0.4022,  0.4019,  0.5661,  0.7088]  # pe_picht_tornozelo_4
  - [ 1.3826,  1.3819,  1.4746,  1.5146,  1.5154,  1.3759,  1.9012,  1.2299]  # pd_picht_joelho_5
  - [-1.5162, -1.3756, -1.9037, -1.2365, -1.3895, -1.3894, -1.4790, -1.5162]  # pe_picht_joelho_6
  - [-1.1127, -1.1122, -1.0396, -0.9358, -0.9363, -0.8648, -1.2829, -1.0253]  # pd_picht_quadril_7   (com trim)
  - [ 0.9296,  0.8579,  1.2761,  1.0223,  1.1096,  1.1096,  1.0351,  0.9296]  # pe_pich_quadril_8   (com trim)
  - [ 0.0000,  0.1745,  0.1745,  0.1745, -0.0000, -0.1745, -0.1745, -0.1745]  # pd_roll_quadril_9
  - [ 0.0000,  0.1745,  0.1745,  0.1745,  0.0000, -0.1745, -0.1745, -0.1745]  # pe_roll_quadril_10
