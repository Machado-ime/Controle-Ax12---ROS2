# =====================================================================
# MATRIZ DE MOVIMENTO "teste_equilibrio" — marcha NO LUGAR, 8 etapas,
# gerada pela IK do controle_pe (Newton sobre a FK do URDF, pé paralelo
# ao tronco, rolls via SINAIS_ROLL, trim de quadril -5° via
# SINAIS_TRIM_QUADRIL — mesma lógica da marcha_pe). X=0 em TODAS as
# colunas: nenhum pé avança, só transferência de peso lateral (roll) +
# levantar cada pé (15mm), em colunas SEPARADAS — diferente da marcha_pe,
# que funde roll+levantamento na mesma coluna.
#
# As 8 etapas (roll°, x_mm, pd_z_mm, pe_z_mm):
#   1) roll=  0, x=0, pd_z=0, pe_z=0    neutro
#   2) roll=+14, x=0, pd_z=0, pe_z=0    peso à direita (PE ainda no chão)
#   3) roll=+14, x=0, pd_z=0, pe_z=15   PE no ar
#   4) roll=+14, x=0, pd_z=0, pe_z=0    PE pousa (roll ainda positivo)
#   5) roll=  0, x=0, pd_z=0, pe_z=0    neutro
#   6) roll=-14, x=0, pd_z=0, pe_z=0    peso à esquerda (PD ainda no chão)
#   7) roll=-14, x=0, pd_z=15, pe_z=0   PD no ar
#   8) roll=-14, x=0, pd_z=0, pe_z=0    PD pousa (roll ainda negativo)
# =====================================================================

